<!DOCTYPE html>
<html lang="tr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batın Buğra ALTUN - Portfolio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Açık & Koyu Tema Özel Stilleri */
        [data-bs-theme="light"] body {
            background-color: #f4f8fb;
            color: #212529;
        }
        [data-bs-theme="dark"] body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Navbar Aktif Sekme */
        [data-bs-theme="light"] .active-pill {
            background-color: #e7f1ff !important;
            color: #0d6efd !important;
        }
        [data-bs-theme="dark"] .active-pill {
            background-color: #1e293b !important;
            color: #60a5fa !important;
        }

        /* Dark Modda Kartlar ve Kutular */
        [data-bs-theme="dark"] .bg-white {
            background-color: #1e293b !important;
            color: #f8fafc !important;
        }
        [data-bs-theme="dark"] .navbar {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        [data-bs-theme="dark"] footer {
            background-color: #1e293b !important;
            border-color: #334155 !important;
        }
        [data-bs-theme="dark"] .text-dark {
            color: #f8fafc !important;
        }
        [data-bs-theme="dark"] .text-secondary, 
        [data-bs-theme="dark"] .text-muted {
            color: #94a3b8 !important;
        }
        [data-bs-theme="dark"] .border {
            border-color: #334155 !important;
        }
        [data-bs-theme="dark"] .border-bottom {
            border-bottom-color: #334155 !important;
        }

        /* Dark Modda Rozetler */
        [data-bs-theme="dark"] .badge[style*="#e7f1ff"] {
            background-color: #0f172a !important;
            color: #60a5fa !important;
            border-color: #334155 !important;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white py-2 border-bottom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/">
                <i class="fa-solid fa-user-graduate text-primary"></i>
                Batın Buğra ALTUN
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-lg-center gap-1">
                    
                    <!-- Ana Sayfa -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill fw-medium {% if request.path == '/' %}active-pill{% else %}text-dark{% endif %}" href="/">
                            <i class="fa-solid fa-house me-1"></i> Ana Sayfa
                        </a>
                    </li>

                    <!-- Staj & Deneyim -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill fw-medium {% if request.path == '/deneyim' %}active-pill{% else %}text-dark{% endif %}" href="{{ url_for('deneyim') }}">
                            <i class="fa-solid fa-briefcase me-1"></i> Staj & Deneyim
                        </a>
                    </li>

                    <!-- Yetenekler -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill fw-medium {% if request.path == '/yetenekler' %}active-pill{% else %}text-dark{% endif %}" href="{{ url_for('yetenekler') }}">
                            <i class="fa-solid fa-wand-magic-sparkles me-1"></i> Yetenekler
                        </a>
                    </li>

                    <!-- Liderlik -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill fw-medium {% if request.path == '/liderlik' %}active-pill{% else %}text-dark{% endif %}" href="{{ url_for('liderlik') }}">
                            <i class="fa-solid fa-users me-1"></i> Liderlik
                        </a>
                    </li>

                    <!-- Referanslar -->
                    <li class="nav-item">
                        <a class="nav-link px-3 rounded-pill fw-medium {% if request.path == '/referanslar' %}active-pill{% else %}text-dark{% endif %}" href="{{ url_for('referanslar') }}">
                            <i class="fa-solid fa-user-check me-1"></i> Referanslar
                        </a>
                    </li>

                    <!-- Tema Değiştirme Butonu (Toggle) -->
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <button id="themeToggleBtn" class="btn btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;" title="Temayı Değiştir">
                            <i id="themeIcon" class="fa-solid fa-moon"></i>
                        </button>
                    </li>

                </ul>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- Footer -->
    <footer class="bg-white py-3 text-center border-top mt-auto">
        <small class="text-muted">© 2026 Batın Buğra ALTUN - Tüm Hakları Saklıdır.</small>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dark / Light Mode Script -->
    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        // Sayfa yüklendiğinde kayıtlı temayı kontrol et
        const savedTheme = localStorage.getItem('theme') || 'light';
        setTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        });

        function setTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'dark') {
                themeIcon.className = 'fa-solid fa-sun text-warning';
            } else {
                themeIcon.className = 'fa-solid fa-moon text-secondary';
            }
        }
    </script>
</body>
</html>
